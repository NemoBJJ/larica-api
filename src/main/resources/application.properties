# ========================
# CONFIGURAÇÕES BÁSICAS
# ========================
spring.application.name=larica-api
server.port=8086
server.servlet.context-path=/api
server.error.include-message=always

# ========================
# BANCO DE DADOS
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/larica_db?useSSL=false&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=010905Euja#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ========================
# MERCADO PAGO (PRODUÇÃO)
# ========================
# (NÃO usar "mode=sandbox")
mercadopago.access-token=APP_USR-8695916848679684-081117-e0fca76775574043876d1e564996d357-149293884
mercadopago.public-key=APP_USR-4f340c9f-4969-4836-b942-87824107771b
mercadopago.notification-url=${app.base-url}/webhooks/mercadopago

# Base URL do backend (respeitando o context-path /api)
app.base-url=http://localhost:8086/api
app.frontend-url=http://localhost:3000

# ========================
# TEMPO / JACKSON
# ========================
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ========================
# LOGGING
# ========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.larica=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.transaction=DEBUG
